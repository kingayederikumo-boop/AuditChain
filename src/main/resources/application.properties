server.port=${PORT:8080}
spring.application.name=auditchain
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
logging.level.root=INFO
logging.level.com.auditchain=INFO

# Default store: SQLite (offline-first, file-backed). Not production-grade on ephemeral disks.
auditchain.store.type=${AUDITCHAIN_STORE_TYPE:sqlite}
auditchain.sqlite.path=${AUDITCHAIN_SQLITE_PATH:data/auditchain.db}
auditchain.demo.enabled=${AUDITCHAIN_DEMO_ENABLED:false}

# Flyway is only active when using postgres profile / store.
spring.flyway.enabled=false
