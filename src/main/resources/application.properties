server.port=${PORT:8080}
spring.application.name=auditchain
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
logging.level.root=INFO
logging.level.com.auditchain=INFO

# File-backed SQLite survives process restarts when the filesystem is persistent.
auditchain.sqlite.path=${AUDITCHAIN_SQLITE_PATH:data/auditchain.db}
# Destructive demo controls are disabled by default.
auditchain.demo.enabled=${AUDITCHAIN_DEMO_ENABLED:false}
