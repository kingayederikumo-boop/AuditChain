server.port=${PORT:8080}
spring.application.name=auditchain
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
logging.level.root=INFO
logging.level.com.auditchain=INFO

auditchain.store.type=${AUDITCHAIN_STORE_TYPE:sqlite}
auditchain.sqlite.path=${AUDITCHAIN_SQLITE_PATH:data/auditchain.db}
auditchain.evidence.db-path=${AUDITCHAIN_EVIDENCE_DB:data/evidence.db}
auditchain.demo.enabled=${AUDITCHAIN_DEMO_ENABLED:false}

auditchain.api-key=${AUDITCHAIN_API_KEY:}
auditchain.api-key.officer=${AUDITCHAIN_API_KEY_OFFICER:}
auditchain.api-key.reviewer=${AUDITCHAIN_API_KEY_REVIEWER:}
auditchain.api-key.auditor=${AUDITCHAIN_API_KEY_AUDITOR:}
auditchain.api-key.admin=${AUDITCHAIN_API_KEY_ADMIN:}
auditchain.auth.enforce=${AUDITCHAIN_AUTH_ENFORCE:true}
auditchain.rate-limit.per-minute=${AUDITCHAIN_RATE_LIMIT:60}
auditchain.actor.hmac-secret=${AUDITCHAIN_ACTOR_HMAC_SECRET:}

auditchain.crypto.ed25519.seed-hex=${AUDITCHAIN_ED25519_SEED:}
auditchain.anchors.log-url=${AUDITCHAIN_ANCHOR_LOG_URL:https://raw.githubusercontent.com/kingayederikumo-boop/AuditChain/audit-anchors/anchors/log.jsonl}

spring.flyway.enabled=false
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

auditchain.vision.url=${AUDITCHAIN_VISION_URL:}
auditchain.vision.api-key=${AUDITCHAIN_VISION_API_KEY:}
