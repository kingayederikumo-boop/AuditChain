server.port=${PORT:8080}
spring.application.name=auditchain
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
logging.level.root=INFO
logging.level.com.auditchain=INFO

# Default store: SQLite (offline-first, file-backed). Not production-grade on ephemeral disks.
auditchain.store.type=${AUDITCHAIN_STORE_TYPE:sqlite}
auditchain.sqlite.path=${AUDITCHAIN_SQLITE_PATH:data/auditchain.db}
auditchain.demo.enabled=${AUDITCHAIN_DEMO_ENABLED:false}

# Auth: set AUDITCHAIN_API_KEY in production. Empty key disables enforcement.
auditchain.api-key=${AUDITCHAIN_API_KEY:}
auditchain.auth.enforce=${AUDITCHAIN_AUTH_ENFORCE:true}
auditchain.rate-limit.per-minute=${AUDITCHAIN_RATE_LIMIT:60}

# Optional deterministic Ed25519 seed (64 hex chars). Random if unset.
auditchain.crypto.ed25519.seed-hex=${AUDITCHAIN_ED25519_SEED:}

# Flyway only when postgres store is active.
spring.flyway.enabled=false

# Upload limit for evidence
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
