# Activate with: --spring.profiles.active=postgres
# or AUDITCHAIN_STORE_TYPE=postgres + spring.datasource.* env vars

auditchain.store.type=postgres

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auditchain}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:auditchain}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:auditchain}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Hikari defaults are fine for the prototype; tune under load.
spring.datasource.hikari.maximum-pool-size=10
