<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0e1013">
<title>AuditChain — Submit a result sheet</title>
<style>
:root{color-scheme:dark;--onyx:#0e1013;--panel:#161a20;--field:#0b0d10;--line:#2a313c;--text:#eceff4;--soft:#a4adbb;--royal:#4169e1;--royal-hi:#e8ebf1;--amber:#f0b441;--tint-amber:#2b2310;
 --serif:Charter,"Bitstream Charter","Sitka Text",Cambria,Georgia,serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--onyx);color:var(--text);font:16px/1.6 var(--sans);max-width:720px;margin-inline:auto;padding:20px 18px 56px}
a{color:var(--royal-hi);font-weight:600;text-underline-offset:3px}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--royal-hi);outline-offset:3px}
.topnav{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-bottom:14px;border-bottom:2px solid var(--royal);margin-bottom:28px}
.brand{font:700 20px/1 var(--serif);color:var(--text);text-decoration:none}
h1{font:700 clamp(26px,6.4vw,38px)/1.12 var(--serif);margin:0 0 10px;letter-spacing:-.01em}
p{color:var(--soft);margin:0 0 12px}
.warning{padding:12px 14px;background:var(--tint-amber);color:#e8d3a0;font-size:15px;border-radius:4px}
form{margin-top:22px;padding:6px 18px 22px;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--royal);border-radius:2px}
label{display:block;margin-top:18px;font-weight:600;font-size:15px}
.hint{display:block;font-weight:400;color:var(--soft);font-size:13px;margin-top:2px}
input,textarea{display:block;width:100%;margin-top:8px;padding:12px;border-radius:4px;border:1px solid #3a4452;background:var(--field);color:var(--text);font:inherit}
textarea{font:14px/1.5 var(--mono)}
input[type=file]{padding:10px}
button{font:inherit;font-weight:600;cursor:pointer;min-height:46px;padding:10px 20px;border-radius:6px;border:2px solid var(--royal);background:var(--royal);color:#fff}
button:hover{background:#3558c8;border-color:#3558c8}
button[type=submit]{width:100%;margin-top:22px}
.secondary{background:transparent;color:var(--royal-hi);border-color:var(--line)}.secondary:hover{background:#161d33;border-color:var(--royal)}
.queue{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
#status{margin-top:18px;padding:12px 14px;border-left:4px solid var(--royal);background:var(--panel);font-size:15px;color:var(--text)}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--field);border:1px solid var(--line);padding:14px;border-radius:4px;font:12px/1.5 var(--mono);color:#c9d3e6;margin-top:12px}
@media(max-width:520px){.queue button{width:100%}}
</style></head><body>
<nav class="topnav"><a class="brand" href="/">AuditChain</a><a href="/">Back to the check</a></nav>
<h1>Submit a result sheet</h1>
<p class="warning">Prototype for synthetic test data only. Items saved offline stay on this device until they are sent or deleted. Do not use real election records or personal information.</p>
<form id="form">
<label>Officer API key<span class="hint">Kept in memory only, never saved.</span><input id="key" type="password" autocomplete="off" required></label>
<label>Polling unit code<input id="location" required maxlength="100"></label>
<label>Figures<span class="hint">JSON. Use totalVotes, total_votes or votes_cast for the declared total.</span><textarea id="payload" rows="5" required>{"partyVotes":{"A":10,"B":12},"totalVotes":22}</textarea></label>
<label>Result sheet image<span class="hint">PNG or JPEG, up to 2 MB.</span><input id="file" type="file" accept="image/png,image/jpeg" required></label>
<button type="submit">Submit, or save offline</button>
</form>
<div class="queue"><button id="retry" class="secondary">Retry saved submissions</button><button id="clear" class="secondary" type="button">Delete saved submissions</button></div>
<p id="status" role="status" aria-live="polite">Ready.</p><pre id="result" aria-label="Last receipt"></pre>
<script>
'use strict';
const $=id=>document.getElementById(id);
const DB='auditchain-offline-v1', STORE='pending';
function db(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB,1);req.onupgradeneeded=()=>req.result.createObjectStore(STORE,{keyPath:'nonce'});req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
async function operation(mode,fn){const d=await db();try{return await new Promise((resolve,reject)=>{const t=d.transaction(STORE,mode),s=t.objectStore(STORE);let value;try{value=fn(s);}catch(e){reject(e);return;}t.oncomplete=()=>resolve(value);t.onerror=()=>reject(t.error);});}finally{d.close();}}
async function items(){const d=await db();try{return await new Promise((resolve,reject)=>{const r=d.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}finally{d.close();}}
async function put(item){await operation('readwrite',s=>s.put(item));}
async function remove(nonce){await operation('readwrite',s=>s.delete(nonce));}
function status(message){$('status').textContent=message;}
async function sanitizeImage(file){
 const bitmap=await createImageBitmap(file);
 const scale=Math.min(1,1600/Math.max(bitmap.width,bitmap.height));
 const canvas=document.createElement('canvas');
 canvas.width=Math.max(1,Math.round(bitmap.width*scale));
 canvas.height=Math.max(1,Math.round(bitmap.height*scale));
 const context=canvas.getContext('2d');
 if(!context){bitmap.close();throw new Error('Image processing is unavailable in this browser.');}
 context.drawImage(bitmap,0,0,canvas.width,canvas.height);
 bitmap.close();
 const blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('Could not process image.')),'image/jpeg',0.82));
 if(blob.size>2*1024*1024) throw new Error('Image is still over 2 MB after compression. Choose a smaller image.');
 return new File([blob],'evidence.jpg',{type:'image/jpeg',lastModified:Date.now()});
}
async function transmit(item){
 const key=$('key').value.trim();if(!key){status('Enter your officer API key to retry.');return false;}
 const form=new FormData();form.append('locationCode',item.location);form.append('payloadJson',item.payload);form.append('file',item.file,item.file.name);
 let response;
 try{response=await fetch('/api/evidence',{method:'POST',headers:{'X-API-Key':key,'Idempotency-Key':item.nonce},body:form});}
 catch(e){status('Network unavailable. Submission remains queued.');return false;}
 if(response.ok){const receipt=await response.json();$('result').textContent=JSON.stringify(receipt,null,2);await remove(item.nonce);status('Submission accepted. Receipt displayed.');return true;}
 const message=await response.text();
 status('Server returned HTTP '+response.status+'. Item retained for review. '+message.slice(0,180));
 return false;
}
async function retry(){const queue=await items();if(!queue.length){status('No queued submissions.');return;}for(const item of queue){if(!(await transmit(item)))break;}}
$('form').addEventListener('submit',async e=>{e.preventDefault();const source=$('file').files[0];if(!source||!['image/png','image/jpeg'].includes(source.type)){status('Select a PNG or JPEG image.');return;}try{JSON.parse($('payload').value);}catch(e){status('Figures must be valid JSON.');return;}try{status('Removing image metadata and compressing…');const file=await sanitizeImage(source);const item={nonce:crypto.randomUUID(),location:$('location').value.trim(),payload:$('payload').value,file,createdAt:new Date().toISOString()};await put(item);status('Privacy-processed image saved to offline queue.');if(navigator.onLine)await transmit(item);}catch(err){status('Unable to process or save image: '+err.message);}});
$('retry').onclick=()=>retry().catch(e=>status('Retry error: '+e.message));
$('clear').onclick=async()=>{if(!confirm('Delete every locally queued submission?'))return;for(const item of await items())await remove(item.nonce);status('Local queue deleted.');};
window.addEventListener('online',()=>{if($('key').value)retry().catch(()=>{});else status('Connection restored. Enter API key and select Retry.');});
</script></body></html>
