<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AuditChain — Evidence Submission</title>
<style>
body{font:16px system-ui;background:#101827;color:#e8edf6;margin:0;padding:1.2rem;max-width:680px;margin-inline:auto}
label{display:block;margin-top:1rem}input,textarea,button{box-sizing:border-box;width:100%;padding:.75rem;border-radius:8px;border:1px solid #56657b;background:#1d293b;color:inherit;font:inherit}button{margin-top:1rem;background:#2563eb;border:0;font-weight:650;cursor:pointer}button:disabled{opacity:.5}small{color:#b8c5d8}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1d293b;padding:1rem;border-radius:8px}a{color:#9cc8ff}.warning{border-left:4px solid #fbbf24;padding-left:.7rem}
body{max-width:760px;padding:clamp(18px,4vw,42px)}.topnav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid #263750;border-radius:12px;background:#111c2d;margin-bottom:28px}.topnav a{color:#9cc8ff;text-decoration:none;font-size:12px;font-weight:650}.brand{font-weight:800;letter-spacing:.12em;color:#e8edf6!important}.eyebrow{font-size:10px;letter-spacing:.16em;color:#57d6dc;font-weight:700}h1{font-size:clamp(26px,5vw,36px);letter-spacing:-.04em;margin:6px 0 8px}p{line-height:1.6;color:#b8c5d8}form{border:1px solid #263750;border-radius:14px;padding:clamp(16px,3vw,26px);background:linear-gradient(145deg,#142238,#101a2a);margin-top:20px}label{font-size:12px;font-weight:650;color:#dce8f7;margin-top:16px}input,textarea{margin-top:7px;background:#0d1929;border-color:#344a65}input:focus,textarea:focus{outline:2px solid #57d6dc;outline-offset:2px}button{border-radius:9px;background:#173b5c;border:1px solid #35577c}button:hover{background:#20517c}#retry,#clear{width:auto;margin-right:8px;padding:10px 14px}#status{padding:12px;border:1px solid #263750;border-radius:9px;background:#111c2d;font-size:12px}pre{border:1px solid #263750;font-size:11px}.warning{border-left-color:#f2bd63;background:#2a2419;padding:12px;border-radius:0 9px 9px 0;color:#e5d4b2}a:focus-visible,button:focus-visible{outline:2px solid #57d6dc;outline-offset:3px}@media(max-width:520px){#retry,#clear{width:100%;margin:8px 0 0}}
</style></head><body>
<nav class="topnav"><a class="brand" href="/">AUDITCHAIN</a><a href="/">← Integrity console</a></nav><div class="eyebrow">FIELD OPERATIONS / EVIDENCE INTAKE</div><h1>Submit evidence.</h1>
<p class="warning">Prototype for synthetic test data only. Offline items remain on this device until successfully submitted or deleted. Do not use real election records or personal information.</p>
<form id="form">
<label>Officer API key (kept in memory only)<input id="key" type="password" autocomplete="off" required></label>
<label>Actor identifier<input id="actor" required maxlength="100" autocomplete="off"></label>
<label>Polling unit code<input id="location" required maxlength="100"></label>
<label>Structured figures (JSON)<textarea id="payload" rows="5" required>{"partyVotes":{"A":10,"B":12},"totalVotes":22}</textarea></label>
<label>Result-sheet image (PNG/JPEG, max 2 MB)<input id="file" type="file" accept="image/png,image/jpeg" required></label>
<button type="submit">Submit or queue offline</button>
</form>
<button id="retry">Retry queued submissions</button><button id="clear" type="button">Delete queued submissions</button>
<p id="status" role="status" aria-live="polite">Ready.</p><pre id="result" aria-label="Last receipt"></pre>
<script>
'use strict';
const $=id=>document.getElementById(id);
const DB='auditchain-offline-v1', STORE='pending';
function db(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB,1);req.onupgradeneeded=()=>req.result.createObjectStore(STORE,{keyPath:'nonce'});req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
async function operation(mode,fn){const d=await db();try{return await new Promise((resolve,reject)=>{const t=d.transaction(STORE,mode),s=t.objectStore(STORE);let value;try{value=fn(s);}catch(e){reject(e);return;}t.oncomplete=()=>resolve(value);t.onerror=()=>reject(t.error);});}finally{d.close();}}
async function items(){const d=await db();try{return await new Promise((resolve,reject)=>{const r=d.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}finally{d.close();}}
async function put(item){await operation('readwrite',s=>s.put(item));}
async function remove(nonce){await operation('readwrite',s=>s.delete(nonce));}
function status(message){$('status').textContent=message;}
async function sanitizeImage(file){
 const bitmap=await createImageBitmap(file);
 const scale=Math.min(1,1600/Math.max(bitmap.width,bitmap.height));
 const canvas=document.createElement('canvas');
 canvas.width=Math.max(1,Math.round(bitmap.width*scale));
 canvas.height=Math.max(1,Math.round(bitmap.height*scale));
 const context=canvas.getContext('2d');
 if(!context){bitmap.close();throw new Error('Image processing is unavailable in this browser.');}
 context.drawImage(bitmap,0,0,canvas.width,canvas.height);
 bitmap.close();
 const blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('Could not process image.')),'image/jpeg',0.82));
 if(blob.size>2*1024*1024) throw new Error('Image is still over 2 MB after compression. Choose a smaller image.');
 return new File([blob],'evidence.jpg',{type:'image/jpeg',lastModified:Date.now()});
}
async function transmit(item){
 const key=$('key').value.trim();if(!key){status('Enter your officer API key to retry.');return false;}
 const form=new FormData();form.append('actorId',item.actor);form.append('locationCode',item.location);form.append('payloadJson',item.payload);form.append('file',item.file,item.file.name);
 let response;
 try{response=await fetch('/api/evidence',{method:'POST',headers:{'X-API-Key':key,'Idempotency-Key':item.nonce},body:form});}
 catch(e){status('Network unavailable. Submission remains queued.');return false;}
 if(response.ok){const receipt=await response.json();$('result').textContent=JSON.stringify(receipt,null,2);await remove(item.nonce);status('Submission accepted. Receipt displayed.');return true;}
 const message=await response.text();
 status('Server returned HTTP '+response.status+'. Item retained for review. '+message.slice(0,180));
 return false;
}
async function retry(){const queue=await items();if(!queue.length){status('No queued submissions.');return;}for(const item of queue){if(!(await transmit(item)))break;}}
$('form').addEventListener('submit',async e=>{e.preventDefault();const source=$('file').files[0];if(!source||!['image/png','image/jpeg'].includes(source.type)){status('Select a PNG or JPEG image.');return;}try{JSON.parse($('payload').value);}catch(e){status('Figures must be valid JSON.');return;}try{status('Removing image metadata and compressing…');const file=await sanitizeImage(source);const item={nonce:crypto.randomUUID(),actor:$('actor').value.trim(),location:$('location').value.trim(),payload:$('payload').value,file,createdAt:new Date().toISOString()};await put(item);status('Privacy-processed image saved to offline queue.');if(navigator.onLine)await transmit(item);}catch(err){status('Unable to process or save image: '+err.message);}});
$('retry').onclick=()=>retry().catch(e=>status('Retry error: '+e.message));
$('clear').onclick=async()=>{if(!confirm('Delete every locally queued submission?'))return;for(const item of await items())await remove(item.nonce);status('Local queue deleted.');};
window.addEventListener('online',()=>{if($('key').value)retry().catch(()=>{});else status('Connection restored. Enter API key and select Retry.');});
</script></body></html>
