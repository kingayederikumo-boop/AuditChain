name: apply-ui-patch3
on: workflow_dispatch
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/apply_ui_patch3.py .
      - run: |
          git rm -q .github/apply_ui_patch3.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "UI: onyx, royal blue and white palette"
          git push
