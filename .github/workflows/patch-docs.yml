name: patch-docs
on: workflow_dispatch
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/patch_docs.py
      - run: |
          git rm -q .github/patch_docs.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Docs: link official-data evaluation, add AI-assistance and data disclosures, update checklist"
          git push
