name: fetch-official-data
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          B=https://raw.githubusercontent.com/Rise-Networks-AI-Labs/-AI4Elections-Hackathon/main/data/synthetic
          D=src/test/resources/official-synthetic
          mkdir -p $D
          curl -fsSL $B/results_synthetic.csv -o $D/results_synthetic.csv
          curl -fsSL $B/anomaly_labels_HELD_OUT.csv -o $D/anomaly_labels_HELD_OUT.csv
          echo "7890642a9dfefdcd50a0ca82cf28aa413896f92fa90c28d29939e59a08785a66  $D/results_synthetic.csv" | sha256sum -c -
          echo "acefc1b42d2fcf63c990fce66535eb8127be4033408719730e7dd79dd17fd1e5  $D/anomaly_labels_HELD_OUT.csv" | sha256sum -c -
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $D
          git commit -q -m "Add official synthetic results data and answer key for evaluation (CC BY 4.0)"
          git push
