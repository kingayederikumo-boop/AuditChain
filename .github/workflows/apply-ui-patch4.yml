name: apply-ui-patch4
on: workflow_dispatch
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/apply_ui_patch4.py .
      - run: |
          git rm -q .github/apply_ui_patch4.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "UI: side drawer menu, checks moved to How it works, Needs review wording"
          git push
