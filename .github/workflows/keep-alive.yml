name: Keep alive

# Pings the public health endpoint so the free Render instance is not idle-stopped
# (it sleeps after ~15 minutes without traffic and takes ~80 s to cold start).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /health
        env:
          BASE_URL: ${{ vars.AUDITCHAIN_BASE_URL || 'https://auditchain.onrender.com' }}
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 "$BASE_URL/health" || true)
            echo "attempt $i -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "health check did not return 200"
          exit 1
